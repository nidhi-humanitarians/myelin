[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myelin"
version = "0.1.0"
description = "Semantic JIT Compiler for Autonomous AI Agents"
authors = [{ name = "Myelin Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "numpy>=1.24.0",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
]
llm = [
    "litellm>=1.0.0",
    "anthropic>=0.20.0",
    "openai>=1.10.0",
]
dev = [
    "black>=23.0",
    "ruff>=0.1.0",
    "pytest>=7.0.0",
]

[project.scripts]
myelin = "myelin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
